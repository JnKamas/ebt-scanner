name: Feature request
description: Suggest an improvement to the note-entry workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user flow and any alternatives considered.
    validations:
      required: true
