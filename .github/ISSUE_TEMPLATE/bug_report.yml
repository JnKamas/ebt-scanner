name: Bug report
description: Tell us what went wrong without sharing private data.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, session cookies, real banknote serials or private locations. Follow SECURITY.md for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use made-up note details and say whether this happened on the live app, a preview or a local copy.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, operating system, browser and app commit/version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots with private details removed
      description: Remove credentials, cookies, real serial numbers and personal information first.
