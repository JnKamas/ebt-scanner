name: App checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:release
        env:
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  release:
    name: Publish release
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify successful pre-merge checks for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const { GITHUB_TOKEN, GITHUB_REPOSITORY, GITHUB_SHA } = process.env;
          const url = `https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100`;
          (async () => {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error(`Cannot verify pre-merge checks: HTTP ${response.status}`);
            const data = await response.json();
            const checked = data.workflow_runs.some(run => run.head_sha === GITHUB_SHA && run.conclusion === 'success' && ['workflow_dispatch', 'pull_request'].includes(run.event));
            if (!checked) throw new Error('Run App checks on the exact release commit before fast-forwarding main.');
            console.log('Successful pre-merge checks verified for the release commit.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - run: node scripts/release.cjs --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
